<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayBlazor — Fluent UI</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link href="_content/PlayBlazor.Demo.Shared/css/demo.css" rel="stylesheet" />
    <link href="PlayBlazor.Demo.FluentUI.styles.css" rel="stylesheet" />
    <style>
        /* Boot screen — an empty specimen stage waiting for its component.
           The fill width tracks Blazor's real load progress via --blazor-load-percentage. */
        .boot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            min-height: 100vh;
            background-color: #ffffff;
            background-image: radial-gradient(#e4e4ec 1px, transparent 1px);
            background-size: 16px 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .boot-chip {
            padding: 0.45rem 1rem;
            border: 1px solid #e6e6ee;
            border-radius: 999px;
            background: #fbfbfd;
            color: #1b1b22;
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.9375rem;
            letter-spacing: 0.01em;
        }

        .boot-caret {
            display: inline-block;
            width: 2px;
            height: 0.9em;
            margin-left: 0.4rem;
            vertical-align: text-bottom;
            background: #6d4aff;
            animation: boot-blink 1.1s steps(2, start) infinite;
        }

        .boot-track {
            width: 220px;
            height: 3px;
            border-radius: 999px;
            background: #e6e6ee;
            overflow: hidden;
        }

        .boot-fill {
            height: 100%;
            width: var(--blazor-load-percentage, 0%);
            border-radius: 999px;
            background: #6d4aff;
            transition: width 200ms ease;
        }

        .boot-caption {
            color: #6e6e7a;
            font-size: 0.75rem;
        }

        .boot-pct {
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            color: #1b1b22;
        }

        .boot-pct::after {
            content: var(--blazor-load-percentage-text, "");
        }

        /* ---- Page overrides (after the shared demo.css, so equal specificity wins) ---- */

        /* Fluent's web components adopt a stylesheet that paints <body> white at 100% height:
           one viewport of white over demo.css's grey html, with a seam through the first bench.
           "html body" outranks that adopted "body" rule. */
        html body {
            background: transparent;
        }

        ::selection {
            background: rgba(109, 74, 255, 0.2);
        }

        .demo-footer a {
            color: var(--demo-accent);
            font-weight: 600;
            text-decoration: none;
        }

        .demo-footer a:hover,
        .demo-footer a:focus-visible {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* The three curated benches above get a marker on their tiles in the wall below. */
        .demo-tile[href$="pb-FluentButton=e30"],
        .demo-tile[href$="pb-FluentDataGrid=e30"],
        .demo-tile[href$="pb-PropertyColumn=e30"] {
            border-color: rgba(109, 74, 255, 0.45);
            background: #f6f3ff;
        }

        @media (max-width: 720px) {
            /* Two tile columns instead of one ~4000px column. */
            .demo-tiles {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            /* PlaygroundView uncaps its parameter list on phones, which put ~1500px of rows
               between the stage and the snippet. Keep a capped, scrolling list instead. */
            .pb-playground .pb-panel {
                max-height: 360px;
            }

            /* The Copy button is absolutely placed over the first code line; give it its own row. */
            .pb-playground .pb-code {
                padding-top: 2.5rem;
            }
        }

        @keyframes boot-blink {
            50% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-caret { animation: none; }
            .boot-fill { transition: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="boot">
            <div class="boot-chip">&lt;PlayBlazor /&gt;<span class="boot-caret"></span></div>
            <div class="boot-track"><div class="boot-fill"></div></div>
            <div class="boot-caption">Loading the .NET runtime <span class="boot-pct"></span></div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
