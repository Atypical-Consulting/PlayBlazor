<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayBlazor — Fluent UI</title>
    <base href="/" />
    <script>
        // Deep links on GitHub Pages: the site-root 404.html sends /<app>/explorer?x back here as
        // ?pb-redirect=explorer%3Fx. Restore the real URL before Blazor's router reads it.
        (function () {
            var r = new URLSearchParams(location.search).get("pb-redirect");
            if (r !== null) history.replaceState(null, "", document.baseURI + r);
        })();
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link href="_content/PlayBlazor.Demo.Shared/css/demo.css" rel="stylesheet" />
    <link href="PlayBlazor.Demo.FluentUI.styles.css" rel="stylesheet" />
    <style>
        /* Boot screen — an empty specimen stage waiting for its component.
           The fill width tracks Blazor's real load progress via --blazor-load-percentage. */
        .boot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            min-height: 100vh;
            background-color: #ffffff;
            background-image: radial-gradient(#e4e4ec 1px, transparent 1px);
            background-size: 16px 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .boot-chip {
            padding: 0.45rem 1rem;
            border: 1px solid #e6e6ee;
            border-radius: 999px;
            background: #fbfbfd;
            color: #1b1b22;
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.9375rem;
            letter-spacing: 0.01em;
        }

        .boot-caret {
            display: inline-block;
            width: 2px;
            height: 0.9em;
            margin-left: 0.4rem;
            vertical-align: text-bottom;
            background: #6d4aff;
            animation: boot-blink 1.1s steps(2, start) infinite;
        }

        .boot-track {
            width: 220px;
            height: 3px;
            border-radius: 999px;
            background: #e6e6ee;
            overflow: hidden;
        }

        .boot-fill {
            height: 100%;
            width: var(--blazor-load-percentage, 0%);
            border-radius: 999px;
            background: #6d4aff;
            transition: width 200ms ease;
        }

        .boot-caption {
            color: #6e6e7a;
            font-size: 0.75rem;
        }

        .boot-pct {
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            color: #1b1b22;
        }

        .boot-pct::after {
            content: var(--blazor-load-percentage-text, "");
        }

        /* ---- Page overrides (after the shared demo.css, so equal specificity wins) ---- */

        /* Fluent's web components adopt a stylesheet that paints <body> white at 100% height:
           one viewport of white over demo.css's grey html, with a seam through the first bench.
           "html body" outranks that adopted "body" rule. */
        html body {
            background: transparent;
        }

        ::selection {
            background: rgba(109, 74, 255, 0.2);
        }

        .demo-footer a {
            color: var(--demo-accent);
            font-weight: 600;
            text-decoration: none;
        }

        .demo-footer a:hover,
        .demo-footer a:focus-visible {
            text-decoration: underline;
            text-underline-offset: 3px;
        }


        /* Hero lines start on the same left edge as the content column below (880px minus its
           1.5rem gutters), not 24px left of it. */
        .demo-hero > * {
            max-width: calc(880px - 3rem);
        }

        /* Scroll cue for capped parameter lists: shadows appear at an edge only while rows hide
           past it (the "local" covers scroll with the content and mask the "scroll" shadows). */
        .pb-playground .pb-panel {
            overscroll-behavior: contain;
            background:
                linear-gradient(var(--pb-panel) 30%, rgba(251, 251, 253, 0)) center top / 100% 2.5rem no-repeat local,
                linear-gradient(rgba(251, 251, 253, 0), var(--pb-panel) 70%) center bottom / 100% 2.5rem no-repeat local,
                radial-gradient(farthest-side at 50% 0, rgba(27, 27, 34, 0.16), transparent) center top / 100% 0.75rem no-repeat scroll,
                radial-gradient(farthest-side at 50% 100%, rgba(27, 27, 34, 0.16), transparent) center bottom / 100% 0.75rem no-repeat scroll,
                var(--pb-panel);
        }

        /* Each bench leads with the parameters its examples exercise. The rows below are hidden on
           the home benches only (each note says so; the Explorer lists them all). PlaygroundView
           gives rows no name hook, so they are picked by position in Fluent 5.0.1's reflection
           order: re-check them when the package changes (the csproj warns on a version bump).
           Button rows 2-7: FormId, FormAction, FormEncType, FormMethod, FormNoValidate, FormTarget.
           Grid rows 2-5: Virtualize, OverscanCount, MaxItemCount, ItemSize.
           Column rows 3-5: Index, Class, Style. */
        #bench-button .pb-panel > :nth-child(n+2 of .pb-row):nth-child(-n+7 of .pb-row),
        #bench-grid .pb-panel > :nth-child(n+2 of .pb-row):nth-child(-n+5 of .pb-row),
        #bench-column .pb-panel > :nth-child(n+3 of .pb-row):nth-child(-n+5 of .pb-row) {
            display: none;
        }

        /* Per-bench jump into the full Explorer, and the docs link set apart from the in-page
           anchors (it leaves the site). */
        .demo-note .fx-open {
            color: #5534e0;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            /* Its own trailing line on every bench, whatever the note's length. */
            display: block;
            width: fit-content;
            margin-top: 0.375rem;
        }

        .demo-note .fx-open:is(:hover, :focus-visible) {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .demo-landing .demo-main .fx-benches a.fx-docs {
            margin-left: auto;
        }

        /* The stage's Dark tool paints a dark surface, but Fluent's tokens live on <html> and stay
           light, so grid text (#242424) vanished on it. Re-declare every colour token that differs
           in Fluent 5.0.1's own dark theme on the dark stage (bench and Explorer), so the specimen
           switches theme with its surface. Values captured from Fluent's generated dark sheet;
           regenerate them if the package's theme changes. */

        /* Fluent sets body text colour once, on <body>, so the specimen inherits a light-theme
           colour already resolved there; re-resolve it inside the dark stage. */
        .pb-stage-dark .pb-specimen,
        .pbw-stage-dark .pbw-specimen-box {
            color: var(--colorNeutralForeground1);
        }

        /* A-Z catalogue: every column's first letter starts on the same line. The shared rule
           drops the top padding only for the very first group, so column 1 sat 12px above the
           rest; a margin is truncated at each column break instead. */
        .demo-tiles .demo-letter {
            padding-top: 0;
        }

        .demo-tiles .demo-letter-group + .demo-letter-group {
            margin-top: 0.75rem;
        }

        @media (min-width: 721px) {
            /* One button or a three-row grid does not need a 480px stage; the shorter list
               scrolls with a cue, and the examples above it carry each bench's main axis. */
            .fx-bench .pb-playground .pb-panel {
                max-height: 340px;
            }

            .fx-bench .pb-playground .pb-preview {
                min-height: 0;
            }

            /* One column of three cells: a shorter list keeps its stage from standing half empty. */
            #bench-column .pb-playground .pb-panel {
                max-height: 280px;
            }
        }

        @media (max-width: 720px) {
            /* Narrow grid benches: less stage gutter and cell padding, and cells wrap instead of
               cutting "Ada Lovelace" to "Ada Lov…". */
            .fx-wide .pb-playground .pb-preview {
                padding-inline: 0.75rem;
            }

            .fx-wide .fluent-data-grid :is(td, th) {
                padding-inline: 8px !important;
                white-space: normal !important;
            }

            /* Fluent pads the header label twice more inside the cell (6px + 12px); without this
               the headers sat 18px right of their column's values. */
            .fx-wide .fluent-data-grid th > div,
            .fx-wide .fluent-data-grid th [col-title] {
                padding-inline: 0 !important;
            }

            /* A wrapped jump bar keeps the docs link on the left edge with the anchors. */
            .demo-landing .demo-main .fx-benches a.fx-docs {
                margin-left: 0;
            }

            /* The button bench needs less stage than a grid. */
            #bench-button .pb-playground .pb-preview {
                min-height: 160px;
            }

            /* Example chips wrap onto a second line: a sideways-scrolling row hid "Disabled" and
               "Loading" off-screen with no cue. */
            .fx-bench .pb-playground .pb-variants {
                flex-wrap: wrap;
                overflow-x: visible;
            }

            /* The snippet keeps its Razor line breaks and scrolls sideways (wrapping split
               "p => p.Name" and orphaned indented attributes). Edge shadows say there is more.
               Overrides the shared wrap rule; the Copy button already has its own row above. */
            .demo-main .fx-bench .pb-code pre {
                white-space: pre;
                overflow-wrap: normal;
            }

            .demo-main .fx-bench .pb-playground .pb-code {
                padding-right: 1rem;
                background:
                    linear-gradient(to right, var(--pb-terminal) 30%, rgba(22, 22, 30, 0)) left center / 2.5rem 100% no-repeat local,
                    linear-gradient(to left, var(--pb-terminal) 30%, rgba(22, 22, 30, 0)) right center / 2.5rem 100% no-repeat local,
                    radial-gradient(farthest-side at 0 50%, rgba(214, 214, 231, 0.28), transparent) left center / 0.875rem 100% no-repeat scroll,
                    radial-gradient(farthest-side at 100% 50%, rgba(214, 214, 231, 0.28), transparent) right center / 0.875rem 100% no-repeat scroll,
                    var(--pb-terminal);
            }

            /* Two tile columns instead of one ~4000px column. */
            .demo-tiles {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            /* PlaygroundView uncaps its parameter list on phones, which put ~1500px of rows
               between the stage and the snippet. Keep a capped, scrolling list instead. */
            .pb-playground .pb-panel {
                max-height: 380px;
            }

            /* The Copy button is absolutely placed over the first code line; give it its own row. */
            .pb-playground .pb-code {
                padding-top: 2.5rem;
            }
        }

        @keyframes boot-blink {
            50% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-caret { animation: none; }
            .boot-fill { transition: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="boot">
            <div class="boot-chip">&lt;PlayBlazor /&gt;<span class="boot-caret"></span></div>
            <div class="boot-track"><div class="boot-fill"></div></div>
            <div class="boot-caption">Loading the .NET runtime <span class="boot-pct"></span></div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
