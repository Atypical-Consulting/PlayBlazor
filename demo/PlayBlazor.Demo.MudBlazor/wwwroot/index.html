<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayBlazor — MudBlazor</title>
    <base href="/" />
    <script>
        // Deep links on GitHub Pages: the site-root 404.html sends /<app>/explorer?x back here as
        // ?pb-redirect=explorer%3Fx. Restore the real URL before Blazor's router reads it.
        (function () {
            var r = new URLSearchParams(location.search).get("pb-redirect");
            if (r !== null) history.replaceState(null, "", document.baseURI + r);
        })();
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/PlayBlazor.Demo.Shared/css/demo.css" rel="stylesheet" />
    <link href="PlayBlazor.Demo.MudBlazor.styles.css" rel="stylesheet" />
    <style>
        /* Boot screen — an empty specimen stage waiting for its component.
           The fill width tracks Blazor's real load progress via --blazor-load-percentage. */
        .boot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            min-height: 100vh;
            background-color: #ffffff;
            background-image: radial-gradient(#e4e4ec 1px, transparent 1px);
            background-size: 16px 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .boot-chip {
            padding: 0.45rem 1rem;
            border: 1px solid #e6e6ee;
            border-radius: 999px;
            background: #fbfbfd;
            color: #1b1b22;
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.9375rem;
            letter-spacing: 0.01em;
        }

        .boot-caret {
            display: inline-block;
            width: 2px;
            height: 0.9em;
            margin-left: 0.4rem;
            vertical-align: text-bottom;
            background: #6d4aff;
            animation: boot-blink 1.1s steps(2, start) infinite;
        }

        .boot-track {
            width: 220px;
            height: 3px;
            border-radius: 999px;
            background: #e6e6ee;
            overflow: hidden;
        }

        .boot-fill {
            height: 100%;
            width: var(--blazor-load-percentage, 0%);
            border-radius: 999px;
            background: #6d4aff;
            transition: width 200ms ease;
        }

        .boot-caption {
            color: #6e6e7a;
            font-size: 0.75rem;
        }

        .boot-pct {
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            color: #1b1b22;
        }

        .boot-pct::after {
            content: var(--blazor-load-percentage-text, "");
        }

        /* Workspace override: keep the snippet clear of the absolutely positioned Copy button.
           Wide screens reserve a gutter on the right; narrow ones, where lines run to the edge
           and scroll, give the button its own row above the code. */
        .demo-host .pb-playground .pb-code {
            padding-right: 4.75rem;
        }

        /* Icon picker on the landing benches: thumbnail inline, left of the name field, the way
           the explorer's workspace lays it out. */
        .demo-host .pb-playground .pb-icon-pair {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            min-width: 0;
        }

        .demo-host .pb-playground .pb-icon-pair > .pb-icon-preview {
            display: inline-flex;
            flex: none;
            width: 20px;
            height: 20px;
            color: #1b1b22;
            opacity: 0.85;
        }

        /* The field takes whatever the thumbnail leaves, so the icon name stays readable. */
        .demo-host .pb-playground .pb-icon-pair > .pb-icon-preview + input[type="text"] {
            flex: 1;
            width: auto;
        }

        /* Landing benches only (.demo-main): the explorer keeps its own workspace chrome. */

        /* Hero jump link and the bench docs links. */
        .demo-jump {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.25rem 0.75rem;
            margin: 0 0 2rem;
            color: var(--demo-ink-2);
            font-size: 0.8125rem;
        }

        .demo-jump a,
        .demo-docs {
            color: #5534e0;
            font-family: var(--demo-mono);
            font-weight: 600;
            text-decoration: none;
            text-underline-offset: 0.2em;
        }

        .demo-jump a:hover,
        .demo-docs:hover,
        .demo-jump a:focus-visible,
        .demo-docs:focus-visible {
            text-decoration: underline;
        }

        .demo-docs {
            margin-left: 0.375rem;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        #all-components {
            scroll-margin-top: 1.5rem;
        }

        /* Landing benches: the parameter panel is capped so a one-button stage is not stretched
           into a tall empty field; long lists scroll inside it. 320px (shared default 300) fits a
           name beside a 132px field. */
        .demo-main .pb-playground {
            grid-template-columns: minmax(0, 1fr) 320px;
        }

        /* Scroll cue: a soft shade pinned to the panel's bottom edge (scroll) is covered by a
           panel-coloured cap that rides on the content's end (local), so the shade shows while
           more parameters sit below and disappears once the list is scrolled to its end. */
        .demo-main .pb-playground .pb-panel {
            max-height: 22.5rem;
            background:
                linear-gradient(rgba(251, 251, 253, 0), var(--pb-panel) 60%) center bottom / 100% 2.5rem no-repeat local,
                linear-gradient(rgba(27, 27, 34, 0), rgba(27, 27, 34, 0.09)) center bottom / 100% 1.75rem no-repeat scroll,
                var(--pb-panel);
        }

        /* One button needs less room than ninety grid parameters. */
        .demo-main .demo-bench-compact .pb-playground .pb-panel {
            max-height: 18rem;
        }

        /* Grid parameter names (ColumnsPanelReordering, DropNotAllowedClass) are long: put each
           name above its field, the way the explorer does at phone width, so names stay whole
           and values are not cut short. Switches keep their one-line row. */
        .demo-main .demo-bench-long .pb-playground .pb-control {
            grid-template-columns: minmax(0, 1fr);
            gap: 0.25rem;
        }

        .demo-main .demo-bench-long .pb-playground .pb-control-bool {
            grid-template-columns: minmax(0, 1fr) auto;
        }

        .demo-main .pb-playground .pb-control-label {
            white-space: normal;
            overflow-wrap: break-word;
            line-height: 1.3;
        }

        /* The events placeholder at body-muted contrast, not the faint tertiary ink. */
        .demo-main .pb-playground .pb-events-empty {
            color: #5f5f6b;
        }

        @media (max-width: 720px) {
            .demo-host .pb-playground .pb-code {
                padding-top: 2.6rem;
                padding-right: 1rem;
            }

            /* Stacked layout: the panel keeps a cap (the shared default lifts it), so ninety
               DataGrid parameters do not push the tiles seven screens down. */
            .demo-main .pb-playground {
                grid-template-columns: minmax(0, 1fr);
            }

            .demo-main .pb-playground .pb-panel,
            .demo-main .demo-bench-compact .pb-playground .pb-panel {
                max-height: 20rem;
                border-bottom: 1px solid var(--pb-line);
            }

            /* Toolbar in the flow under the chip, never over the specimen's first row. */
            .demo-main .pb-playground .pb-preview {
                padding-top: 2.75rem;
            }

            .demo-main .pb-playground .pb-stage-toolbar {
                position: static;
                align-self: flex-start;
                margin-bottom: 1rem;
            }
        }

        @keyframes boot-blink {
            50% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-caret { animation: none; }
            .boot-fill { transition: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="boot">
            <div class="boot-chip">&lt;PlayBlazor /&gt;<span class="boot-caret"></span></div>
            <div class="boot-track"><div class="boot-fill"></div></div>
            <div class="boot-caption">Loading the .NET runtime <span class="boot-pct"></span></div>
        </div>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
