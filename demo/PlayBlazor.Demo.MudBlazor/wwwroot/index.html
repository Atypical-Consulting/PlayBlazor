<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayBlazor — MudBlazor</title>
    <base href="/" />
    <script>
        // Deep links on GitHub Pages: the site-root 404.html sends /<app>/explorer?x back here as
        // ?pb-redirect=explorer%3Fx. Restore the real URL before Blazor's router reads it.
        (function () {
            var r = new URLSearchParams(location.search).get("pb-redirect");
            if (r !== null) history.replaceState(null, "", document.baseURI + r);
        })();
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/PlayBlazor.Demo.Shared/css/demo.css" rel="stylesheet" />
    <link href="PlayBlazor.Demo.MudBlazor.styles.css" rel="stylesheet" />
    <style>
        /* Boot screen — an empty specimen stage waiting for its component.
           The fill width tracks Blazor's real load progress via --blazor-load-percentage. */
        .boot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            min-height: 100vh;
            background-color: #ffffff;
            background-image: radial-gradient(#e4e4ec 1px, transparent 1px);
            background-size: 16px 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .boot-chip {
            padding: 0.45rem 1rem;
            border: 1px solid #e6e6ee;
            border-radius: 999px;
            background: #fbfbfd;
            color: #1b1b22;
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.9375rem;
            letter-spacing: 0.01em;
        }

        .boot-caret {
            display: inline-block;
            width: 2px;
            height: 0.9em;
            margin-left: 0.4rem;
            vertical-align: text-bottom;
            background: #6d4aff;
            animation: boot-blink 1.1s steps(2, start) infinite;
        }

        .boot-track {
            width: 220px;
            height: 3px;
            border-radius: 999px;
            background: #e6e6ee;
            overflow: hidden;
        }

        .boot-fill {
            height: 100%;
            width: var(--blazor-load-percentage, 0%);
            border-radius: 999px;
            background: #6d4aff;
            transition: width 200ms ease;
        }

        .boot-caption {
            color: #6e6e7a;
            font-size: 0.75rem;
        }

        .boot-pct {
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            color: #1b1b22;
        }

        .boot-pct::after {
            content: var(--blazor-load-percentage-text, "");
        }

        /* Workspace override: keep the snippet clear of the absolutely positioned Copy button.
           Wide screens reserve a gutter on the right; narrow ones, where lines run to the edge
           and scroll, give the button its own row above the code. */
        .demo-host .pb-playground .pb-code {
            padding-right: 4.75rem;
        }

        /* Icon picker on the landing benches: thumbnail inline, left of the name field, the way
           the explorer's workspace lays it out. */
        .demo-host .pb-playground .pb-icon-pair {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            min-width: 0;
        }

        .demo-host .pb-playground .pb-icon-pair > .pb-icon-preview {
            display: inline-flex;
            flex: none;
            width: 20px;
            height: 20px;
            color: #1b1b22;
            opacity: 0.85;
        }

        /* Thumbnail + field take the same 132px as every other control, so the column stays even. */
        .demo-host .pb-playground .pb-icon-pair > .pb-icon-preview + input[type="text"] {
            width: 106px;
        }

        /* Landing benches only (.demo-main): the explorer keeps its own workspace chrome. */

        /* Hero jump link and the bench docs links. */
        .demo-jump {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.25rem 0.75rem;
            margin: 0 0 2rem;
            color: var(--demo-ink-2);
            font-size: 0.8125rem;
        }

        .demo-jump a,
        .demo-docs {
            color: #5534e0;
            font-family: var(--demo-mono);
            font-weight: 600;
            text-decoration: none;
            text-underline-offset: 0.2em;
        }

        .demo-jump a:hover,
        .demo-docs:hover,
        .demo-jump a:focus-visible,
        .demo-docs:focus-visible {
            text-decoration: underline;
        }

        .demo-docs {
            margin-left: 0.375rem;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        #all-components {
            scroll-margin-top: 1.5rem;
        }

        /* A shorter parameter column, so a one-button stage is not stretched into a tall empty
           field; long parameter lists scroll inside it. */
        /* 320px (shared default 300) fits names like DropNotAllowedClass beside a 132px field. */
        .demo-main .pb-playground {
            grid-template-columns: minmax(0, 1fr) 320px;
        }

        .demo-main .pb-playground .pb-panel {
            max-height: 22.5rem;
            overscroll-behavior: contain;
        }

        /* Long parameter names wrap instead of ending in an ellipsis. */
        .demo-main .pb-playground .pb-control-label {
            white-space: normal;
            overflow-wrap: anywhere;
            line-height: 1.3;
        }

        /* The events placeholder at body-muted contrast, not the faint tertiary ink. */
        .demo-main .pb-playground .pb-events-empty {
            color: #5f5f6b;
        }

        /* Stage toolbar: words, not glyphs. The glyph is hidden and the label drawn in its place,
           so the button reads (and is announced) as what it toggles. */
        .demo-main .pb-playground .pb-env-btn {
            width: auto;
            padding: 0 0.45rem;
            font-size: 0;
        }

        .demo-main .pb-playground .pb-env-btn::after {
            font-family: var(--pb-sans);
            font-size: 0.6875rem;
            font-weight: 500;
        }

        .demo-main .pb-playground .pb-env-dark::after { content: "Dark"; }
        .demo-main .pb-playground .pb-env-rtl::after { content: "RTL"; }
        .demo-main .pb-playground .pb-env-checker::after { content: "Grid"; }

        .demo-main .pb-playground .pb-stage-toolbar::before {
            content: "Width";
            order: 1;
            margin-left: 0.25rem;
            color: #5f5f6b;
            font-size: 0.6875rem;
        }

        .demo-main .pb-playground .pb-env-width {
            order: 2;
        }

        .demo-main .pb-playground .pb-stage-dark .pb-stage-toolbar::before {
            color: #b9b9c9;
        }

        @media (max-width: 720px) {
            .demo-host .pb-playground .pb-code {
                padding-top: 2.6rem;
                padding-right: 1rem;
            }

            /* Stacked layout: the panel keeps a cap (the shared default lifts it), so ninety
               DataGrid parameters do not push the tiles seven screens down. */
            .demo-main .pb-playground {
                grid-template-columns: minmax(0, 1fr);
            }

            .demo-main .pb-playground .pb-panel {
                max-height: 26rem;
                border-bottom: 1px solid var(--pb-line);
            }

            /* Chip on its own line, toolbar beneath it, so neither overlaps on a phone. */
            .demo-main .pb-playground .pb-preview {
                padding-top: 4.25rem;
            }

            .demo-main .pb-playground .pb-stage-toolbar {
                top: 2.5rem;
                left: 0.75rem;
                right: auto;
            }
        }

        @keyframes boot-blink {
            50% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-caret { animation: none; }
            .boot-fill { transition: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="boot">
            <div class="boot-chip">&lt;PlayBlazor /&gt;<span class="boot-caret"></span></div>
            <div class="boot-track"><div class="boot-fill"></div></div>
            <div class="boot-caption">Loading the .NET runtime <span class="boot-pct"></span></div>
        </div>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
