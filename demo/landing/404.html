<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayBlazor — page not found</title>
    <link rel="icon" type="image/png" href="/PlayBlazor/favicon.png" />
    <script>
        // GitHub Pages serves this one file for every missing path on the whole site, but each
        // showcase routes on the client: /PlayBlazor/daisy/explorer?pb-Button=e30 is a real page
        // of the daisy app. Hand the rest of the URL to that app, whose index.html puts it back.
        (function () {
            var m = location.pathname.match(/^(\/PlayBlazor\/(?:daisy|mud|fluent)\/)(.+)$/);
            if (m) location.replace(m[1] + "?pb-redirect=" + encodeURIComponent(m[2] + location.search + location.hash));
        })();
    </script>
    <link rel="preload" href="/PlayBlazor/bricolage.woff2" as="font" type="font/woff2" crossorigin />
    <style>
        @font-face { font-family: "Bricolage Grotesque"; src: url("/PlayBlazor/bricolage.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
        :root { color-scheme: light dark; --bg: #ffffff; --ink: #1b1b22; --muted: #5f5f6b; --accent: #6d4aff; --link: #4b2ed6; }
        @media (prefers-color-scheme: dark) { :root { --bg: #121118; --ink: #ecebf3; --muted: #a3a2b3; --accent: #9a82ff; --link: #b9a9ff; } }
        body { margin: 0; min-height: 100vh; display: grid; place-content: center; padding: 1rem; text-align: center;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.55; color: var(--ink); background: var(--bg); }
        .brand { font: 700 1.1875rem/1 "Bricolage Grotesque", system-ui, sans-serif; color: var(--ink); text-decoration: none; }
        .brand span { color: var(--accent); }
        h1 { margin: 2rem 0 0.5rem; font: 800 clamp(2rem, 1.5rem + 2vw, 3rem)/1.05 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.03em; }
        p { margin: 0; color: var(--muted); }
        a { color: var(--link); text-underline-offset: 0.2em; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
    </style>
</head>
<body>
    <a class="brand" href="/PlayBlazor/"><span aria-hidden="true">&#9654;</span> PlayBlazor</a>
    <h1>No page here</h1>
    <p>That address does not exist. <a href="/PlayBlazor/">Back to PlayBlazor</a> or <a href="/PlayBlazor/#libraries">pick a library</a>.</p>
</body>
</html>
