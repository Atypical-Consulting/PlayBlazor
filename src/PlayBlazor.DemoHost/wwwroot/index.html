<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayBlazor DemoHost</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/demo.css" rel="stylesheet" />
    <link href="PlayBlazor.DemoHost.styles.css" rel="stylesheet" />
    <style>
        /* Boot screen — an empty specimen stage waiting for its component.
           The fill width tracks Blazor's real load progress via --blazor-load-percentage. */
        .boot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            min-height: 100vh;
            background-color: #ffffff;
            background-image: radial-gradient(#e4e4ec 1px, transparent 1px);
            background-size: 16px 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .boot-chip {
            padding: 0.45rem 1rem;
            border: 1px solid #e6e6ee;
            border-radius: 999px;
            background: #fbfbfd;
            color: #1b1b22;
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.9375rem;
            letter-spacing: 0.01em;
        }

        .boot-caret {
            display: inline-block;
            width: 2px;
            height: 0.9em;
            margin-left: 0.4rem;
            vertical-align: text-bottom;
            background: #6d4aff;
            animation: boot-blink 1.1s steps(2, start) infinite;
        }

        .boot-track {
            width: 220px;
            height: 3px;
            border-radius: 999px;
            background: #e6e6ee;
            overflow: hidden;
        }

        .boot-fill {
            height: 100%;
            width: var(--blazor-load-percentage, 0%);
            border-radius: 999px;
            background: #6d4aff;
            transition: width 200ms ease;
        }

        .boot-caption {
            color: #6e6e7a;
            font-size: 0.75rem;
        }

        .boot-pct {
            font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
            color: #1b1b22;
        }

        .boot-pct::after {
            content: var(--blazor-load-percentage-text, "");
        }

        @keyframes boot-blink {
            50% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-caret { animation: none; }
            .boot-fill { transition: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="boot">
            <div class="boot-chip">&lt;PlayBlazor /&gt;<span class="boot-caret"></span></div>
            <div class="boot-track"><div class="boot-fill"></div></div>
            <div class="boot-caption">Loading the .NET runtime <span class="boot-pct"></span></div>
        </div>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
