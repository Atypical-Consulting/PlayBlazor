# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# This workflow triggers on pushes to the main branch.
# It builds the project, runs the tests and packs + validates the NuGet package. Releasing and
# publishing to NuGet live in release-please.yml.

name: Main Branch CI

on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - "main"       # Trigger the workflow on pushes to the main branch
  pull_request:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      # `dotnet test` runs in Microsoft.Testing.Platform mode (see global.json), so coverage is
      # collected through the MTP `--coverage` options, not VSTest's `--collect:"XPlat Code
      # Coverage"` — the latter is silently ignored under MTP and would upload nothing.
      - name: Run Unit Tests
        run: >
          dotnet test --configuration Release
          --coverage
          --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload Code Coverage
        uses: codecov/codecov-action@v7

  create_nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install the .NET SDK indicated in the global.json file
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore

      # Build the project first so that the staticwebassets.build.json manifest is generated
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Create the NuGet package in the folder from the environment variable NuGetDirectory
      - name: Create NuGet package
        run: dotnet pack src/PlayBlazor/PlayBlazor.csproj --configuration Release --no-build --output ${{ env.NuGetDirectory }}

      # Publish the NuGet package as an artifact, so they can be used in the following jobs.
      # Only .nupkg: symbols are embedded in the assembly (see Directory.Build.props), so no
      # symbol package is produced. Were one ever added, it would have to be listed here too —
      # `dotnet nuget push` only forwards a .snupkg that sits NEXT TO the .nupkg, and `*.nupkg`
      # does not match `.snupkg`.
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NuGetDirectory }}/*.nupkg

  validate_nuget:
    runs-on: ubuntu-latest
    needs: [ create_nuget ]
    steps:
      # Install the .NET SDK indicated in the global.json file
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Install nuget validator
        run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global

      # Validate metadata and content of the NuGet package
      # https://www.nuget.org/packages/Meziantou.Framework.NuGetPackageValidation.Tool#readme-body-tab
      # If some rules are not applicable, you can disable them
      # using the --excluded-rules or --excluded-rule-ids option
      - name: Validate package
        run: meziantou.validate-nuget-package (Get-ChildItem "${{ env.NuGetDirectory }}/*.nupkg")
