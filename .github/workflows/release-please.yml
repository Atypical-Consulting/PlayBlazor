name: release-please

# Derives the next semantic version from Conventional Commits on every push to `main` and keeps a
# release PR up to date (bumping <Version> in Directory.Build.props via the x-release-please-version
# marker, plus CHANGELOG.md and .release-please-manifest.json). Merging that PR tags vX.Y.Z, creates
# the GitHub Release, and the publish job below pushes the package to NuGet and attaches it to the
# Release.
#
# The publish job lives in THIS workflow, gated on `release_created`: a tag pushed by
# release-please-action with the default GITHUB_TOKEN does not trigger other workflows.
#
# PRs land squash-merged, so the PR TITLE becomes the commit message on `main`: it is the PR title
# that decides the next version (pr-title.yml enforces the format).

on:
  push:
    branches: [main]
  # Manual re-run: refreshes the release PR, or finishes a merged release whose run failed.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # release-please creates the `autorelease: pending` label it uses to find the merged release PR.
  issues: write

# Serialize runs so two overlapping pushes can't race on the release PR or the tag.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Pack & publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload the package to the release
      id-token: write # OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

      # Only .nupkg: symbols are embedded in the assembly (see Directory.Build.props).
      - name: Pack
        run: dotnet pack src/PlayBlazor/PlayBlazor.csproj -c Release -o artifacts

      - name: Validate package
        run: |
          dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global
          meziantou.validate-nuget-package artifacts/*.nupkg

      # Trusted publishing: exchanges the OIDC token for a NuGet key valid about an hour. Needs a policy
      # on nuget.org naming this repository and this workflow file (release-please.yml), and the
      # NUGET_USER secret (the nuget.org profile name). Deliberately not skipped when the secret is
      # missing: a release that was meant to publish and could not must fail, not go green.
      - name: NuGet login (OIDC to short-lived key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" artifacts/*.nupkg --clobber
