# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Publishes the Blazor WebAssembly demo to GitHub Pages.
# One-time setup: repository Settings → Pages → Source = "GitHub Actions".

name: Deploy demo

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: mud
            project: demo/PlayBlazor.Demo.MudBlazor/PlayBlazor.Demo.MudBlazor.csproj
          - app: fluent
            project: demo/PlayBlazor.Demo.FluentUI/PlayBlazor.Demo.FluentUI.csproj
          # daisyUI is a Tailwind plugin, so its stylesheet is generated, not shipped — but no Node
          # step is needed: the DaisyBlazor NuGet package downloads the Tailwind standalone CLI
          # (linux-x64 on ubuntu-latest) and compiles wwwroot/css/app.css during this very publish.
          - app: daisy
            project: demo/PlayBlazor.Demo.Daisy/PlayBlazor.Demo.Daisy.csproj
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Publish the app
        run: dotnet publish ${{ matrix.project }} -c Release -o publish

      # The build already errors when the Tailwind CLI cannot be fetched. This checks the generated
      # sheet actually reached the published output: a daisy app without it boots, works, and
      # renders every component unstyled — a failure only a browser would show.
      - name: Verify the generated Tailwind stylesheet
        if: matrix.app == 'daisy'
        run: |
          grep -q '\.btn' publish/wwwroot/css/app.css \
            || { echo "::error::css/app.css is missing or holds no daisyUI classes"; exit 1; }

      # The site is served from https://atypical-consulting.github.io/PlayBlazor/<app>/, not from
      # a domain root, so every asset URL Blazor resolves — _framework, _content, the scoped CSS —
      # has to be rooted at that prefix.
      - name: Rewrite the base href for the project subpath
        run: sed -i 's|<base href="/" />|<base href="/PlayBlazor/${{ matrix.app }}/" />|' publish/wwwroot/index.html

      # sed reports success when it matches nothing, which would ship a site whose every asset
      # 404s and whose failure only shows up in a browser. Fail the build here instead.
      - name: Verify the base href was rewritten
        run: |
          grep -q '<base href="/PlayBlazor/${{ matrix.app }}/" />' publish/wwwroot/index.html \
            || { echo "::error::base href was not rewritten — did index.html change shape?"; exit 1; }

      # Pages serves 404.html for any path it holds no file for. Each app routes on the client,
      # and a PlayBlazor permalink IS a deep link, so an unknown path must return the app shell
      # and let the Blazor router take it from there.
      - name: Install the SPA fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.app }}
          path: publish/wwwroot
          retention-days: 1

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: staging

      - name: Lay the site out
        run: |
          mkdir -p site
          cp demo/landing/index.html demo/landing/favicon.png site/
          for app in mud fluent daisy; do
            mv "staging/app-$app" "site/$app"
          done

      # Belt and braces: the Pages artifact is served as-is today, but should this ever be served
      # through Jekyll it would strip _framework/ and _content/ for starting with an underscore.
      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Verify all apps landed
        run: |
          # Keep in step with the loop above and the build matrix.
          for app in mud fluent daisy; do
            test -f "site/$app/index.html" \
              || { echo "::error::$app is missing from the assembled site"; exit 1; }
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d3.outputs.page_url || steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      # Pages' deployment API intermittently returns "Deployment failed, try again later" — a
      # backend hiccup unrelated to the build, which clears on a plain re-run. Try up to 3 times;
      # the first two tolerate failure so a transient miss doesn't fail the job, and only the last
      # attempt can.
      - name: Deploy to GitHub Pages (attempt 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Deploy to GitHub Pages (attempt 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Deploy to GitHub Pages (attempt 3)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v5
